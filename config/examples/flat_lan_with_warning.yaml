# KH PTZ Control — Example: Flat LAN (not recommended — produces WARNING)
#
# SAFE SAMPLE — fake site name, RFC1918 example IP, fake installation ID.
# Use this example only if a dedicated AV VLAN is not available.
# The system will produce a WARNING in 'khptz doctor' for flat LAN installations.
#
# See docs/NETWORK_ARCHITECTURE.md for remediation steps.

site:
  name: "Example Venue C (Flat LAN)"
  contact: "AV Support Team"
  installation_profile: "starter_1_camera"
  installation_id: "khptz-2026-EXAMPLE"

cameras:
  - id: platform
    role: platform
    ip: "192.168.1.20"
    visca_id: "81"

atem:
  ip: ""

runtime:
  data_dir: ""
  connectivity_mode: "offline"

features:
  atem_enabled: false
  simulation: false

network:
  profile: "flat_lan"
  notes: "No dedicated AV VLAN available at this site. Accepted risk, documented at installation."
