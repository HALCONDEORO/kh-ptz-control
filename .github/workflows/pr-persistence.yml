name: PR startup and persistence gate
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: pr-persistence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  startup-persistence-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.9'
      - name: Install Qt libraries and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
          python -m pip install -r requirements-dev.txt
      - name: Startup, persistence and restore contracts (no hardware)
        run: python scripts/run_release_tests.py
