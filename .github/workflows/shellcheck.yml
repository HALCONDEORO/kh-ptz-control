name: ShellCheck

on:
  push:
    paths:
      - "**/*.sh"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    paths:
      - "**/*.sh"
      - ".github/workflows/shellcheck.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shellcheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # `bash -n` is a distinct gate from ShellCheck: it is the real interpreter
      # rejecting a script it cannot parse, which is exactly the class of
      # breakage that strands a half-installed appliance. #891 requires both.
      # Runs first so a syntax error is reported before lint noise.
      - name: Validate shell syntax (bash -n)
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r script; do
            if bash -n "${script}"; then
              echo "ok    ${script}"
            else
              echo "FAIL  ${script}" >&2
              status=1
            fi
          done < <(find . -type f -name '*.sh' -not -path './.git/*')
          exit "${status}"

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: "."
          severity: warning

