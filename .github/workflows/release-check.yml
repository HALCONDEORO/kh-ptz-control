name: Release Check

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  release-check:
    name: pre-deployment release check
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Download repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system dependencies for PyQt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: "[1/11] Run full test suite"
        run: python -m pytest

      - name: "[2/11] Run Ruff lint"
        run: python -m ruff check .

      - name: "[3/11] Run ShellCheck on installer scripts"
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: "."
          severity: warning

      - name: "[4/11] Run startup smoke tests (hardware-free)"
        run: |
          python -m pytest tests/test_startup_smoke.py tests/test_app_context.py tests/test_main_startup.py -v

      - name: "[5/11] Verify khptz CLI entry point"
        run: |
          python -m runtime.cli version
          python -m runtime.cli doctor || true

      - name: "[6/11] Verify required docs and files are present"
        run: |
          echo "Checking required files..."
          for f in README.md VERSION requirements.txt runtime/installer/install.sh runtime/systemd/khptz-control.service; do
            if [ -f "$f" ]; then
              echo "  [OK] $f"
            else
              echo "  [MISSING] $f"
              MISSING_FILES=1
            fi
          done
          if [ -n "${MISSING_FILES:-}" ]; then
            echo "ERROR: One or more required files are missing."
            exit 1
          fi
          echo "All required files present."

      # Report the recorded decision even if an earlier check failed.
      # Neither this nor the SBOM step can turn that failure into success.
      - name: "[7/11] Checklist decision gate (NOT_TESTED never counts as pass)"
        if: ${{ !cancelled() }}
        run: python3 scripts/check_release_readiness.py docs/RELEASE_READINESS_CHECKLIST.md

      # Collect independent SBOM evidence even when the decision gate blocks.
      # This does not neutralize prior failures: the job remains failed.
      - name: "[8/11] Generate and validate SBOM"
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/generate_sbom.py --include-transitive --out "$RUNNER_TEMP/sbom.json"
          python3 scripts/validate_sbom.py "$RUNNER_TEMP/sbom.json"

      - name: "[9/11] Verify issue dependency snapshot is current"
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_issue_blocks_map.py

      - name: "[10/11] Prepare and verify temporary candidate integrity"
        if: ${{ !cancelled() }}
        run: python3 scripts/package_candidate.py --out "$RUNNER_TEMP/khptz-candidate"
      # Audit exactly the installed closure from step 8, without re-resolving,
      # installing, fixing, ignoring or silently skipping any declared pin.
      - name: "[11/11] Audit exact SBOM Python pins (all reported severities block)"
        if: ${{ !cancelled() }}
        run: |
          python3 -m pip_audit --version
          python3 scripts/check_sbom_audit.py "$RUNNER_TEMP/sbom.json" --write-requirements "$RUNNER_TEMP/sbom-audit.txt"
          audit_rc=0
          python3 -m pip_audit --strict --no-deps --disable-pip --vulnerability-service pypi --cache-dir "$RUNNER_TEMP/pip-audit-cache" --format json -r "$RUNNER_TEMP/sbom-audit.txt" -o "$RUNNER_TEMP/sbom-audit.json" || audit_rc=$?
          python3 scripts/check_sbom_audit.py "$RUNNER_TEMP/sbom.json" --audit-report "$RUNNER_TEMP/sbom-audit.json"
          test "$audit_rc" -eq 0
