name: Release Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    name: pre-deployment release check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Download repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system dependencies for PyQt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: "[1/6] Run full test suite"
        run: python -m pytest

      - name: "[2/6] Run Ruff lint"
        run: python -m ruff check .

      - name: "[3/6] Run ShellCheck on installer scripts"
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: "."
          severity: warning

      - name: "[4/6] Run startup smoke tests (hardware-free)"
        run: |
          python -m pytest tests/test_startup_smoke.py tests/test_app_context.py tests/test_main_startup.py -v

      - name: "[5/6] Verify khptz CLI entry point"
        run: |
          python -m runtime.cli version
          python -m runtime.cli doctor || true

      - name: "[6/6] Verify required docs and files are present"
        run: |
          echo "Checking required files..."
          for f in README.md VERSION requirements.txt runtime/installer/install.sh runtime/systemd/khptz-control.service; do
            if [ -f "$f" ]; then
              echo "  [OK] $f"
            else
              echo "  [MISSING] $f"
              MISSING_FILES=1
            fi
          done
          if [ -n "${MISSING_FILES:-}" ]; then
            echo "ERROR: One or more required files are missing."
            exit 1
          fi
          echo "All required files present."

