name: Secret Scan

# Scan for accidental secret commits on every push and PR.
# See scripts/check_secrets.py for implementation and allowlist rules.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.9"

      - name: Run repo hygiene check (filename-based)
        run: python scripts/check_repo_hygiene.py

      - name: Run secret content scan (tracked files)
        run: python scripts/check_secrets.py --all

