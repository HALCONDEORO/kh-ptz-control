version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    labels:
      - "area: dependencies"
      - "area: security"
    schedule:
      interval: "weekly"
    groups:
      python-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # These releases drop Python 3.9, but the supported runtime target is
      # Python 3.9.2 (Raspberry Pi OS Bullseye) and CI runs on 3.9. Stay on the
      # last 3.9-compatible series until/unless the 3.9 target is dropped.
      - dependency-name: "pytest"      # 9.x requires Python >= 3.10
        versions: [">=9.0.0"]
      - dependency-name: "pip-audit"   # 2.10.x requires Python >= 3.10
        versions: [">=2.10.0"]
      - dependency-name: "bandit"      # 1.9.x requires Python >= 3.10
        versions: [">=1.9.0"]
      - dependency-name: "pytest-forked"  # 1.7.5 requires Python >= 3.10 (PR #902)
        versions: [">=1.7.5"]
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - "area: ci"
      - "area: dependencies"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 5

# Dependabot PRs intentionally follow normal review and CI. Do not enable
# automatic merge until branch protection, required checks and release lock
# handling are validated together.
